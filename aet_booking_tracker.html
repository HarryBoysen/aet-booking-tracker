<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AET Booking Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px}
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#1a7a55,#0f5a3d);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:#fff;padding:3rem;width:min(400px,90vw);border-radius:16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-box h1{font-size:28px;margin-bottom:20px}
.login-box p{font-size:14px;color:#666;margin-bottom:30px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:12px 16px;background:#fff;border:1px solid #ddd;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;transition:all 0.2s}
.google-btn:hover{background:#f8f8f6;border-color:#bbb}
.error{color:red;font-size:13px;margin-top:10px;display:none}
#app{display:none}
#app.active{display:block}
.page{max-width:1200px;margin:0 auto;padding:1.5rem}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap}
.header h1{font-size:20px}
.logout-btn{background:#d32f2f;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.logout-btn:hover{background:#b71c1c}
.top-tabs{display:flex;gap:4px;margin-bottom:1.25rem;border-bottom:0.5px solid #e0e0dc}
.top-tab{font-size:13px;font-weight:500;color:#888;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent}
.top-tab.active{color:#1a7a55;border-bottom-color:#1a7a55}
.tab-panel{display:none}
.tab-panel.active{display:block}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 14px;border:0.5px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
.btn:hover{background:#f0f0ee}
.btn.primary{background:#1a7a55;border-color:#1a7a55;color:#fff}
.booking-card{background:#fff;border-radius:12px;border:0.5px solid #e0e0dc;padding:12px 16px;margin-bottom:10px}
.booking-card:hover{background:#fafaf8}
.empty{text-align:center;padding:3rem;color:#999}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-screen">
  <div class="login-box">
    <div style="font-size:56px;margin-bottom:20px">🔐</div>
    <h1>AET Booking Tracker</h1>
    <p>Sign in with your Google account</p>
    <button class="google-btn" id="googleSignIn">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Sign in with Google
    </button>
    <div class="error" id="err">Sign in failed. Try again.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="page">
    <div class="header">
      <h1>AET Booking Tracker</h1>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>

    <div class="top-tabs">
      <div class="top-tab active" onclick="switchTab(0)">📅 Bookings</div>
      <div class="top-tab" onclick="switchTab(1)">📊 Stats</div>
      <div class="top-tab" onclick="switchTab(2)">👥 Partners</div>
      <div class="top-tab" onclick="switchTab(3)">📖 SOPs</div>
    </div>

    <div class="tab-panel active">
      <button class="btn primary">+ New Booking</button>
      <div id="bookings" style="margin-top:2rem"></div>
    </div>

    <div class="tab-panel">
      <p style="text-align:center;padding:2rem;color:#666">Stats loading...</p>
    </div>

    <div class="tab-panel">
      <p style="text-align:center;padding:2rem;color:#666">Partners loading...</p>
    </div>

    <div class="tab-panel">
      <p style="text-align:center;padding:2rem;color:#666">SOPs loading...</p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
// Firebase
const config = {
  apiKey: "AIzaSyAIOaGt05ggJD9mcAa96OymC8_U55O6xQU",
  authDomain: "aet-booking-tracker.firebaseapp.com",
  projectId: "aet-booking-tracker",
  storageBucket: "aet-booking-tracker.firebasestorage.app",
  messagingSenderId: "750269064961",
  appId: "1:750269064961:web:814ef3573a9a01dfc2dd00"
};

firebase.initializeApp(config);
const auth = firebase.auth();
const db = firebase.firestore();

// Google Sign-In
document.getElementById('googleSignIn').addEventListener('click', () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    console.error(err);
    document.getElementById('err').style.display = 'block';
  });
});

// Auth state
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('active');
    loadData();
  } else {
    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').classList.remove('active');
  }
});

// Logout
function logout() {
  if (confirm('Sign out?')) {
    auth.signOut();
  }
}

// Tab switching
function switchTab(n) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.top-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel')[n].classList.add('active');
  document.querySelectorAll('.top-tab')[n].classList.add('active');
}

// Load data
function loadData() {
  db.collection('bookings').onSnapshot(snap => {
    const html = snap.docs.map(d => {
      const b = d.data();
      return `<div class="booking-card">
        <strong>${b.ref}</strong> ${b.guest} <span style="color:#888">${b.agent}</span>
      </div>`;
    }).join('') || '<div class="empty">No bookings</div>';
    document.getElementById('bookings').innerHTML = html;
  });
}
</script>

</body>
</html>
